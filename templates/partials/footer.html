<footer class="site-footer mt-5">
  <div class="container py-4">
    <div class="row g-4">
      <div class="col-md-4">
        <h5>{{ site_name }}</h5>
        <p>{{ site_tagline }}</p>
      </div>
      <div class="col-md-8 footer-links">
        {% if not user.is_authenticated or user.role == 'STUDENT' %}
          <a href="{% url 'learning:levels' %}">Aprender</a>
          <a href="{% url 'activities:list' %}">Actividades</a>
          <a href="{% url 'readings:list' %}">Lecturas</a>
        {% elif user.role == 'PARENT' %}
          <a href="{% url 'dashboard:parents' %}">Panel familiar</a>
        {% endif %}
        <a href="{% url 'core:privacy' %}">Privacidad</a>
      </div>
    </div>
  </div>
</footer>
