{% extends 'accounts/student_access_base.html' %}
{% block title %}Acceso para estudiantes | {{ site_name }}{% endblock %}
{% block kid_access_content %}
<div class="kid-access__header">
  <div>
    <span class="eyebrow">Acceso para estudiantes</span>
    <h1>Escribe el código de tu aula</h1>
    <p>Tu docente te dice las letras y números.</p>
  </div>
  <button class="btn btn-outline-primary kid-access__listen" type="button" data-speak-text="Escribe el código de tu aula. Tu docente te dice las letras y números.">Escuchar</button>
</div>
<form method="post" class="kid-code-form">
  {% csrf_token %}
  <label class="visually-hidden" for="classroom-code">Código del aula</label>
  <input id="classroom-code" class="kid-code-form__input" type="text" name="code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234" required autofocus>
  <button class="btn btn-primary kid-code-form__submit" type="submit">Entrar a mi aula</button>
</form>
<div class="kid-access__actions"><a class="btn btn-outline-primary kid-access__back" href="{% url 'accounts:login' %}">Usar PIN</a></div>
{% endblock %}
