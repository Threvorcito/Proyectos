{% extends 'base.html' %}
{% block extra_css %}
<style>
  .kid-access { background: #fbf6ec; min-height: 78vh; }
  .kid-access__shell { margin: 0 auto; max-width: 1040px; padding: 2rem 1rem 4rem; }
  .kid-access__header { align-items: center; display: flex; gap: 1rem; justify-content: space-between; margin-bottom: 1.5rem; }
  .kid-access__header h1 { color: #26303d; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; margin: 0; }
  .kid-access__header p { color: #4a5565; font-size: 1.2rem; margin: .35rem 0 0; }
  .kid-access__grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .kid-card { background: #fffdf8; border: 2px solid #eadfcb; border-radius: 24px; box-shadow: 0 10px 28px rgba(92, 70, 32, .08); color: #26303d; min-height: 170px; padding: 1.25rem; text-align: left; transition: transform .15s ease, border-color .15s ease; width: 100%; }
  .kid-card:hover, .kid-card:focus { border-color: #1d6f84; transform: translateY(-2px); }
  .kid-card__avatar { align-items: center; background: linear-gradient(135deg, #1d6f84, #6a45b0); border-radius: 22px; color: #fff; display: inline-flex; font-size: 2rem; font-weight: 900; height: 72px; justify-content: center; margin-bottom: 1rem; overflow: hidden; width: 72px; }
  .kid-card__avatar img { height: 100%; object-fit: cover; width: 100%; }
  .kid-card .kid-card__avatar { color: #fff; display: inline-flex; font-size: 2rem; margin-top: 0; }
  .kid-card strong { display: block; font-size: 1.45rem; line-height: 1.15; }
  .kid-card span { color: #4a5565; display: block; font-size: .98rem; margin-top: .45rem; }
  .kid-access__actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
  .kid-access__back { border-radius: 999px; font-weight: 700; min-height: 56px; padding: .8rem 1.4rem; }
  .visual-key-row { background: #fffdf8; border: 2px solid #eadfcb; border-radius: 24px; margin-bottom: 1rem; padding: 1rem; }
  .visual-key-row h2 { color: #26303d; font-size: 1.35rem; font-weight: 800; margin-bottom: .8rem; }
  .visual-key-options { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); }
  .visual-key-option input { position: absolute; opacity: 0; }
  .visual-key-option span { align-items: center; background: #f6efe2; border: 2px solid #eadfcb; cursor: pointer; border-radius: 18px; display: flex; flex-direction: column; font-size: 2rem; font-weight: 900; gap: .25rem; min-height: 94px; justify-content: center; padding: .7rem; }
  .visual-key-option input:checked + span { background: #e1f1f4; border-color: #1d6f84; box-shadow: 0 0 0 4px rgba(29, 111, 132, .2); color: #165a6b; }
  .visual-key-option input:focus-visible + span { outline: 3px solid #1d6f84; outline-offset: 3px; }
  .visual-key-option small { color: #26303d; font-size: .95rem; font-weight: 600; }
  .kid-code-form { background: #fffdf8; border: 2px solid #eadfcb; border-radius: 24px; display: flex; flex-wrap: wrap; gap: 1rem; padding: 1.25rem; }
  .kid-code-form__input { background: #fff; border: 3px solid #7a6a52; border-radius: 20px; color: #26303d; flex: 1 1 260px; font-size: clamp(2rem, 8vw, 3.25rem); font-weight: 900; letter-spacing: .3em; min-height: 88px; min-width: 0; padding: .5rem 1rem; text-align: center; text-transform: uppercase; }
  .kid-code-form__input:focus { border-color: #1d6f84; outline: 3px solid #1d6f84; outline-offset: 3px; }
  .kid-code-form__submit { border-radius: 999px; flex: 1 1 200px; font-size: 1.35rem; font-weight: 800; min-height: 88px; }
  @media (max-width: 700px) { .kid-access__header { align-items: flex-start; flex-direction: column; } .kid-card { min-height: 145px; } }
</style>
{% endblock %}
{% block content %}
<section class="kid-access">
  <div class="kid-access__shell">
    {% block kid_access_content %}{% endblock %}
  </div>
</section>
{% endblock %}
