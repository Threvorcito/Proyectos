{% extends 'base.html' %}
{% block extra_css %}
<style>
  .kid-access { background: linear-gradient(135deg, #eef8ff 0%, #fff8e8 100%); min-height: 78vh; }
  .kid-access__shell { margin: 0 auto; max-width: 1040px; padding: 2rem 1rem 4rem; }
  .kid-access__header { align-items: center; display: flex; gap: 1rem; justify-content: space-between; margin-bottom: 1.5rem; }
  .kid-access__header h1 { color: #14213d; font-size: clamp(2rem, 6vw, 4rem); font-weight: 900; letter-spacing: -.04em; margin: 0; }
  .kid-access__header p { color: #41526b; font-size: 1.15rem; margin: .35rem 0 0; }
  .kid-access__listen { border-radius: 999px; font-weight: 900; min-height: 48px; }
  .kid-access__grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .kid-card { background: #fff; border: 2px solid #dbeafe; border-radius: 24px; box-shadow: 0 18px 40px rgba(15, 23, 42, .08); color: #17233c; min-height: 170px; padding: 1.25rem; text-align: left; transition: transform .15s ease, border-color .15s ease; width: 100%; }
  .kid-card:hover, .kid-card:focus { border-color: #2563eb; transform: translateY(-2px); }
  .kid-card__avatar { align-items: center; background: linear-gradient(135deg, #60a5fa, #7c3aed); border-radius: 22px; color: #fff; display: inline-flex; font-size: 2rem; font-weight: 900; height: 72px; justify-content: center; margin-bottom: 1rem; overflow: hidden; width: 72px; }
  .kid-card__avatar img { height: 100%; object-fit: cover; width: 100%; }
  .kid-card strong { display: block; font-size: 1.45rem; line-height: 1.15; }
  .kid-card span { color: #52637a; display: block; font-size: .98rem; margin-top: .45rem; }
  .kid-access__actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
  .kid-access__back { border-radius: 999px; font-weight: 900; padding: .8rem 1.15rem; }
  .visual-key-row { background: #fff; border: 2px solid #dbeafe; border-radius: 24px; margin-bottom: 1rem; padding: 1rem; }
  .visual-key-row h2 { color: #14213d; font-size: 1.35rem; font-weight: 900; margin-bottom: .8rem; }
  .visual-key-options { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr)); }
  .visual-key-option input { position: absolute; opacity: 0; }
  .visual-key-option span { align-items: center; background: #f8fafc; border: 2px solid #dbeafe; border-radius: 18px; display: flex; flex-direction: column; font-size: 2rem; font-weight: 900; gap: .25rem; min-height: 94px; justify-content: center; padding: .7rem; }
  .visual-key-option input:checked + span { background: #dbeafe; border-color: #2563eb; color: #1d4ed8; }
  .visual-key-option small { color: #334155; font-size: .78rem; }
  .kid-code-form { background: #fff; border: 2px solid #dbeafe; border-radius: 24px; display: flex; flex-wrap: wrap; gap: 1rem; padding: 1.25rem; }
  .kid-code-form__input { border: 3px solid #93c5fd; border-radius: 20px; color: #14213d; flex: 1 1 260px; font-size: clamp(2rem, 8vw, 3.25rem); font-weight: 900; letter-spacing: .3em; min-height: 88px; min-width: 0; padding: .5rem 1rem; text-align: center; text-transform: uppercase; }
  .kid-code-form__input:focus { border-color: #2563eb; outline: 3px solid #bfdbfe; }
  .kid-code-form__submit { border-radius: 999px; flex: 1 1 200px; font-size: 1.35rem; font-weight: 900; min-height: 88px; }
  @media (max-width: 700px) { .kid-access__header { align-items: flex-start; flex-direction: column; } .kid-card { min-height: 145px; } }
</style>
{% endblock %}
{% block content %}
<section class="kid-access">
  <div class="kid-access__shell">
    {% block kid_access_content %}{% endblock %}
  </div>
</section>
{% endblock %}
