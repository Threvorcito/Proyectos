{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <h1>Actividades</h1>
  <div class="row g-4 mt-2">
    {% for activity in activities %}
      <div class="col-md-6 col-lg-4">
        <a class="card-link" href="{% url 'activities:detail' activity.pk %}">
          <div class="feature-card level-green">
            <small>Nivel {{ activity.level.number }}</small>
            <h3>{{ activity.title }}</h3>
            <p>{{ activity.description }}</p>
          </div>
        </a>
      </div>
    {% empty %}
      <p>No hay actividades.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
