{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="activity-shell">
    <div class="activity-header">
      <span>Actividad</span>
      <h1>{{ activity.title }}</h1>
      <p>{{ activity.instructions }}</p>
    </div>
    <div class="activity-options">
      {% for option in activity.options.all %}
        <form method="post" action="{% url 'activities:submit_answer' activity.pk %}" class="option-form">{% csrf_token %}
          <input type="hidden" name="answer" value="{{ option.text }}">
          <input type="hidden" name="is_correct" value="{% if option.is_correct %}1{% else %}0{% endif %}">
          <button class="option-btn" type="submit">{{ option.text }}</button>
        </form>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
