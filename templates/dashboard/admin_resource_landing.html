{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="d-flex flex-wrap justify-content-between gap-2 align-items-center mb-4">
    <div>
      <span class="eyebrow">Gestión</span>
      <h1>{{ config.title }}</h1>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" href="{% url 'dashboard:admin_resource_create' resource %}">Agregar {{ config.singular }}</a>
      <a class="btn btn-outline-primary" href="{% url 'dashboard:redirect' %}">Volver</a>
    </div>
  </div>

  <div class="list-group">
    {% for item in objects %}
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ item }}</span>
        {% if not config.form %}
          <a class="btn btn-sm btn-outline-primary" href="{% url 'dashboard:admin_resource_update' resource item.pk %}">Editar</a>
        {% endif %}
      </div>
    {% empty %}
      <div class="alert alert-info">No hay registros todavía.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
