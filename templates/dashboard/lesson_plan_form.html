{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="mx-auto" style="max-width: 900px;">
    <span class="eyebrow">Plan de clase</span>
    <h1>{% if is_edit %}Editar plan{% else %}Crear plan{% endif %}</h1>
    <form method="post" class="feature-card mt-4">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-outline-primary" href="{% url 'dashboard:lesson_plans' %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
